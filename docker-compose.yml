services:
  haris-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haris_biometric_core
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "80:8501"
    volumes:
      - ./data:/app/data
      - ./nameslist.txt:/app/nameslist.txt
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
